# Contributor environment AND deployment stack: the Clips Kitty engine plus
# the renderer served by nginx.
#
#   docker compose up --build        engine on http://localhost:8765,
#                                    ui on http://localhost:5173
#   docker compose run --rm engine pytest
#   docker compose --profile dev up ui-dev    live-reload dev server
#
# Not an installation route — creators use the Windows installer. See
# docs/DOCKER.md for what this can and cannot do.

services:
  engine:
    # Always build from this fork's source. (Upstream pinned a prebuilt
    # GHCR image here; with `image:` present, compose pulls it instead of
    # building, so local changes never made it into the container.)
    build: .
    # No ports published here: deploy platforms (Coolify) reach containers
    # over the Docker network and a fixed host port would collide between
    # projects on one server. Local development gets the ports from
    # docker-compose.override.yml, which compose merges automatically and
    # `docker compose -f docker-compose.yml` deployments ignore.
    volumes:
      # No source bind mount: the image already contains the code, and on
      # deploy platforms (e.g. Coolify) `.` is not the source checkout — an
      # empty mount would shadow /app and the container would fail to start.
      # Downloads, clips and the database persist in a named volume rather
      # than the container, which is thrown away on every rebuild.
      - clips-data:/data
    environment:
      CLIPS_STUDIO_DATA_DIR: /data
      # Windows-locale encoding is not a container problem, but the engine
      # prints titles containing emoji and the default here is ASCII.
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      # Optional single-user login wall for exposing the API beyond localhost.
      # Set BOTH (non-empty) to require a login; unset either leaves the API
      # fully open as it is by default. See docs/API.md (Authentication).
      #
      # Written as ${VAR} references, not literals: a literal value is baked
      # into the deployment unchanged, so variables set in Coolify's UI would
      # be silently ignored — only ${VAR} references pull from the resource's
      # Environment Variables page. The `:-` fallbacks keep plain local
      # `docker compose up` behaving exactly as before.
      CLIPS_STUDIO_AUTH_USER: ${CLIPS_STUDIO_AUTH_USER:-admin}
      CLIPS_STUDIO_AUTH_PASSWORD: ${CLIPS_STUDIO_AUTH_PASSWORD:-change-me}

  # The renderer, built for production and served by nginx, which also
  # reverse-proxies the API and the /ws WebSocket to the engine. The browser
  # therefore only ever talks to ONE origin — expose this service (Coolify
  # domain, port 5173 locally) and the engine does not need a public one.
  ui:
    build: ./ui
    depends_on:
      - engine

  # The front-end dev toolchain: Vite, React, TypeScript with live reload.
  # Off by default (profile "dev") so deployments only run the two services
  # above; start it with `docker compose --profile dev up ui-dev`.
  #
  # This serves the RENDERER, not Electron. Electron needs a display, so the
  # desktop shell still runs on your host — see docs/DOCKER.md. In a browser
  # the interface works and talks to the engine; only the native bits
  # (file pickers, the donate window, external links) are unavailable,
  # because those live in Electron's preload.
  ui-dev:
    profiles: [dev]
    image: node:20-slim
    working_dir: /app/ui
    ports:
      - '127.0.0.1:5174:5173'
    volumes:
      - .:/app
      # Anonymous volume so the container keeps its OWN node_modules. Without
      # this the host's are mounted over the top, and esbuild/rollup ship
      # platform-specific binaries — Windows ones do not run on Linux, and
      # the failure is a confusing "cannot find module" for a package that
      # is plainly installed.
      - ui-node-modules:/app/ui/node_modules
    # dev:web serves the renderer alone, via ui/vite.config.mts. Plain
    # `vite` would find no config: the app is built by electron-vite, whose
    # config describes three bundles and cannot serve one of them on its own.
    command: >
      sh -c "npm install && npm run dev:web"
    environment:
      # Vite needs polling to see edits made on a Windows or macOS host
      # through a bind mount; inotify does not cross that boundary.
      CHOKIDAR_USEPOLLING: 'true'

volumes:
  clips-data:
  ui-node-modules:
